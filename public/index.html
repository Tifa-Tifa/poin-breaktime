<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7fb">
  <meta name="description" content="Dashboard Poin Breaktime untuk memantau performa, aktivitas, dan rekap poin karyawan per outlet.">
  <link rel="icon" href="/assets/breaktime-logo-150.webp" type="image/webp">
  <title>Poin Breaktime</title>
  <style>:root{--bg:#fffefa;--muted:#66636f}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app-loading{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:16px;color:var(--muted)}.loading-logo-frame{display:flex;width:240px;height:100px;align-items:center;justify-content:center;overflow:hidden}.loading-logo-frame picture,.loading-logo-frame img{display:block;width:100%;height:100%}.loading-logo-frame img{object-fit:contain}</style>
  <link rel="stylesheet" href="/styles.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/styles.css"></noscript>
</head>
<body>
  <div id="app"><div class="app-loading"><span class="loading-logo-frame"><picture><source type="image/avif" srcset="/assets/breaktime-logo-150.avif 150w, /assets/breaktime-logo-300.avif 300w" sizes="150px"><img src="/assets/breaktime-logo-150.webp" srcset="/assets/breaktime-logo-150.webp 150w, /assets/breaktime-logo-300.webp 300w" sizes="150px" alt="Breaktime" width="150" height="100" fetchpriority="high" decoding="async"></picture></span><span>Menyiapkan dashboard…</span></div></div>
  <div id="toast-region" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
